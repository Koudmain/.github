# --- KINDS (Nature de l'issue) ---
- name: "bug"
  color: "d73a4a"
  description: "Unexpected error or software failure requiring a fix."
- name: "feature"
  color: "a2eeef"
  description: "New functionality or module to be developed for the platform."
- name: "docs"
  color: "0075ca"
  description: "Improvements or updates to README, API docs, or technical specs."
- name: "refactor"
  color: "e6e6e6"
  description: "Code maintenance or structural changes without new features."

