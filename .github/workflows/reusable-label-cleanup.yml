name: "Reusable - Label cleanup"

on:
  workflow_call:
    inputs:
      ci-failed:
        type: boolean
        required: true

jobs:
  label-on-failure:
    name: "Label PR as 'to fix'"
    if: inputs.ci-failed && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-add-label.yml
    with:
      label: "to fix"
    permissions:
      pull-requests: write

  remove-force-ci-label:
    name: "Remove 'force ci' label"
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove "force ci" label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "force ci" \
            --repo ${{ github.repository }} || true

  remove-to-merge-label:
    name: "Remove 'to merge' label"
    if: inputs.ci-failed && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove "to merge" label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "to merge" \
            --repo ${{ github.repository }} || true
