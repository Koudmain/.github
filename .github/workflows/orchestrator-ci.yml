name: "Orchestrator - CI"

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      node-version:
        type: string
        default: "24"
      go-version:
        type: string
        default: "stable"
      run-tests:
        type: boolean
        default: false
      run-precommit:
        type: boolean
        default: false
      run-deploy:
        type: boolean
        default: false
    secrets:
      ORG_PAT:
        required: false

jobs:
  pre-commit-go:
    name: "Pre-commit Checks (Go)"
    if: inputs.run-precommit && inputs.language == 'go'
    uses: ./.github/workflows/reusable-precommit-go.yml
    with:
      go-version: ${{ inputs.go-version }}

  pre-commit-node:
    name: "Pre-commit Checks (Node)"
    if: inputs.run-precommit && inputs.language == 'node'
    uses: ./.github/workflows/reusable-precommit-node.yml
    with:
      node-version: ${{ inputs.node-version }}

  label-on-failure:
    name: "Label PR as 'to fix'"
    needs: [pre-commit-go, pre-commit-node]
    if: failure() && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-label-on-failure.yml
    permissions:
      pull-requests: write

  remove-force-ci-label:
    name: "Remove 'force ci' label"
    needs: [pre-commit-go, pre-commit-node]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove "force ci" label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "force ci" \
            --remove-label "to merge" \
            --repo ${{ github.repository }} || true
