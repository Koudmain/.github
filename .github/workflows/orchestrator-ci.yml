name: "Orchestrator - CI"

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
      node-version:
        type: string
        default: "24"
      go-version:
        type: string
        default: "stable"
      run-tests:
        type: boolean
        default: false
      run-precommit:
        type: boolean
        default: false
      run-deploy:
        type: boolean
        default: false
    secrets:
      ORG_PAT:
        required: false

jobs:
  pre-commit:
    name: "Pre-commit Checks"
    if: inputs.run-precommit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.language == 'node'
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - run: npm ci
        if: inputs.language == 'node'

      - uses: actions/setup-go@v5
        if: inputs.language == 'go'
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1

  label-on-failure:
    name: "Label PR as 'to fix'"
    needs: [pre-commit]
    if: failure() && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-label-on-failure.yml
    permissions:
      pull-requests: write
