name: "Reusable - Pre-commit (Node)"

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"

jobs:
  pre-commit:
    name: "Pre-commit Checks (Node)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check if project uses pnpm, yarn or npm and set the appropriate install command
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi

      # Install pnpm if the project uses it, otherwise setup Node.js with the appropriate package manager
      - name: Install pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.manager }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual
