name: Feature Request
description: File a feature request.
title: "[Feat]: "
labels: ["feature"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Describe the feature you want to add.
      placeholder: Tell us what you want to add!
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What should be true for this feature to be considered done?
      placeholder: |
        - [ ] The feature does X...
        - [ ] The feature does Y...
        - [ ] The feature does Z...
