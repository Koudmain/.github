name: Documentation Update
description: File a documentation update or new documentation.
title: "[Docs]: "
labels: ["docs"]
type: docs
projects: ["Koudmain/documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to complete documentation!
  - type: textarea
    id: documentation-subject
    attributes:
      label: What needs to be documented?
      description: Describe clearly what should be documented. Be specific about the feature, API endpoint, process, or functionality.
      placeholder: |
        Example: The new authentication API endpoints (login, logout, refresh token)
        - What are the endpoints?
        - What parameters do they accept?
        - What are the expected responses?
        - Any code examples needed?
    validations:
      required: true
  - type: dropdown
    id: documentation-type
    attributes:
      label: Type of documentation
      description: What type of documentation is this?
      options:
        - API Documentation
        - User Guide
        - Developer Guide
        - Setup/Installation Guide
        - Troubleshooting Guide
        - Architecture Documentation
        - Tutorial
        - FAQ
        - Other
    validations:
      required: true
  - type: textarea
    id: documentation-context
    attributes:
      label: Additional Context
      description: Provide any additional information that might help with the documentation (links to code, PRs, issues, existing docs to reference, etc.)
      placeholder: |
        - Link to PR or code:
        - Existing documentation to reference:
        - Technical details or examples:
        - Resources:
