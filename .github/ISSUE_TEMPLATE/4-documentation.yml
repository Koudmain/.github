name: Documentation Update
description: File a documentation.
title: "[Docs]: "
labels: ["docs"]
type: docs
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to complete documentation!
  - type: dropdown
    id: project
    attributes:
      label: Impacted project
      description: Which project is this feature request for?
      options:
        - All
        - Koudmain-web
        - Koudmain-backend
        - Koudmain-mobile-worker
        - Koudmain-mobile-client
        - Koudmain-documentation
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What should be true for this feature to be considered done?
      placeholder: |
        - [ ] The feature does X...
        - [ ] The feature does Y...
        - [ ] The feature does Z...
